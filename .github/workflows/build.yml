# ---------------------------------------------------------------------
# CI workflow (Task D): builds the WAR and runs the unit tests on every
# push and pull request, then keeps the WAR as a downloadable artifact.
# ---------------------------------------------------------------------
name: Build and test

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Maven build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -B compile

      - name: Run unit tests
        run: mvn -B test

      - name: Package the WAR
        run: mvn -B package -DskipTests

      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Publish the WAR
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-war
          path: target/sunrise.war
