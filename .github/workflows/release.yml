# ---------------------------------------------------------------------
# Deployment workflow (Task D): tagging a version builds the WAR and
# attaches it to a GitHub release, which is the artefact deployed to the
# clinic's Tomcat server.
# ---------------------------------------------------------------------
name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build the release WAR
        run: mvn -B clean package

      - name: Attach the WAR to the release
        uses: softprops/action-gh-release@v2
        with:
          files: target/sunrise.war
          generate_release_notes: true
