# ---------------------------------------------------------------------
# Sunrise Dental Clinic - application configuration
# Values here can be overridden with -D system properties at start-up,
# which is how the CI workflow points the tests at a throwaway database.
# ---------------------------------------------------------------------
db.url=jdbc:mysql://localhost:3306/sunrise_dental?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
db.user=root
db.password=1234

# Where uploaded medical report files are written on the server disk
storage.reports.dir=${user.home}/sunrise-reports

# First super admin, created on first start-up only. Change the password
# immediately after signing in.
bootstrap.superadmin.username=superadmin
bootstrap.superadmin.password=Super@123
